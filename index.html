<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>FormaCast</title>
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#0E1520" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="FormaCast" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root{--bg:#0E1520;--bg2:#111C29;--panel:#16212F;--panelHi:#1B2938;--line:#243244;--lineSoft:#1D2A39;
        --text:#E7EDF3;--mute:#8798AB;--faint:#586B80;--accent:#4FC3E8;--strong:#39B98A;--mid:#E0A82E;--weak:#D9645B;--chip:#0A1119;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  button,input{font-family:inherit}
  .mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
  input[type=range]{-webkit-appearance:none;height:4px;background:var(--line);border-radius:4px}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--accent);border:2px solid var(--bg)}
  .scroll::-webkit-scrollbar{height:0}
  .row:hover{background:var(--panelHi)}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState, useEffect, useMemo} = React;
const API = "";  // same origin (served by FastAPI). For a separate host, put the API URL here.

const EMAIL_HASH="b7923bd5fcd894985b13eaefb6ee67cca0935af82532b71ab6a7b4b72be29317";
const PASS_HASH ="291360373561865051837e7843d6fc7755aaaf08b766638578b7b1ad9644915e";
async function sha256(s){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");}

const pct=p=>Math.round(p*100)+"%";
const fx2=n=>Number(n).toFixed(2);
const conf=p=>p>=0.65?"var(--strong)":p>=0.52?"var(--mid)":"var(--weak)";
const fmtDate=iso=>{const[,m,d]=iso.split("-");return d+"."+m;};
const fmtKick=iso=>{if(!iso)return null;try{const t=new Date(iso);return t.toLocaleTimeString("ro-RO",{hour:"2-digit",minute:"2-digit"});}catch{return null;}};
// Etichete scurte, fără ambiguitate: "1"/"2" arată explicit liga întâi vs a doua.
const DIV_SHORT={E0:"Anglia 1",E1:"Anglia 2",SP1:"Spania 1",SP2:"Spania 2",I1:"Italia 1",I2:"Italia 2",
  D1:"Germania 1",D2:"Germania 2",F1:"Franța 1",F2:"Franța 2",SC0:"Scoția 1",SC1:"Scoția 2",
  N1:"Olanda",P1:"Portugalia",T1:"Turcia",B1:"Belgia",G1:"Grecia"};
const divShort=(div,league)=>DIV_SHORT[div]||(league?league.split(" · ")[0]:"");

function Bar({p,color}){return <div style={{height:5,background:"var(--chip)",borderRadius:3,overflow:"hidden",flex:1}}>
  <div style={{width:Math.max(0,Math.min(100,p*100))+"%",height:"100%",background:color,borderRadius:3}}/></div>;}

function Login({onOk}){
  const[e,setE]=useState(""),[p,setP]=useState(""),[err,setErr]=useState(""),[busy,setBusy]=useState(false);
  const go=async()=>{setBusy(true);setErr("");
    try{const[eh,ph]=await Promise.all([sha256(e.trim().toLowerCase()),sha256(p)]);
      if(eh===EMAIL_HASH&&ph===PASS_HASH)onOk();else setErr("Email sau parolă greșite.");}
    catch{setErr("Eroare.");}setBusy(false);};
  const inp={width:"100%",background:"var(--chip)",color:"var(--text)",border:"1px solid var(--line)",borderRadius:9,padding:"12px 13px",fontSize:15,marginBottom:11};
  return <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
    <div style={{width:"100%",maxWidth:340}}>
      <div style={{fontSize:26,fontWeight:700,textAlign:"center",letterSpacing:-0.5}}>Forma<span style={{color:"var(--accent)"}}>·</span>Cast</div>
      <div style={{fontSize:12.5,color:"var(--mute)",textAlign:"center",margin:"4px 0 22px"}}>Autentificare</div>
      <input style={inp} type="email" placeholder="email" value={e} autoCapitalize="none" onChange={x=>setE(x.target.value)} onKeyDown={x=>x.key==="Enter"&&go()}/>
      <input style={inp} type="password" placeholder="parolă" value={p} onChange={x=>setP(x.target.value)} onKeyDown={x=>x.key==="Enter"&&go()}/>
      {err&&<div style={{color:"var(--weak)",fontSize:12.5,marginBottom:10}}>{err}</div>}
      <button onClick={go} disabled={busy} style={{width:"100%",padding:12,borderRadius:9,border:"none",background:"var(--accent)",color:"var(--bg)",fontSize:15,fontWeight:700,opacity:busy?0.6:1}}>{busy?"…":"Intră"}</button>
    </div></div>;
}

function Board(){
  const[data,setData]=useState(null),[err,setErr]=useState(null),[divF,setDivF]=useState("ALL");
  const[open,setOpen]=useState(null),[slip,setSlip]=useState([]),[stake,setStake]=useState(10);
  const[slipOpen,setSlipOpen]=useState(false),[copied,setCopied]=useState(false);
  const[tab,setTab]=useState("matches");

  useEffect(()=>{fetch(API+"/api/fixtures").then(r=>r.json()).then(setData).catch(()=>setErr("Nu pot contacta serverul."));},[]);
  const[euro,setEuro]=useState([]);
  useEffect(()=>{fetch(API+"/api/euro-fixtures").then(r=>r.json()).then(d=>setEuro(d.fixtures||[])).catch(()=>{});},[]);
  const fixtures=data?data.fixtures:[];
  const leagues=useMemo(()=>{const s=[];for(const f of fixtures)if(!s.find(x=>x.div===f.div))s.push({div:f.div,league:f.league});return s;},[fixtures]);
  const list=divF==="ALL"?fixtures:fixtures.filter(f=>f.div===divF);

  const isSel=id=>slip.some(s=>s.id===id);
  const toggle=(id,pl)=>setSlip(c=>c.some(s=>s.id===id)?c.filter(s=>s.id!==id):[...c,{id,...pl}]);

  // daily best picks
  const[dMinP,setDMinP]=useState(0.7),[dMinOdd,setDMinOdd]=useState(1.3),[dSort,setDSort]=useState("prob");
  const daily=useMemo(()=>{
    const cand=[];
    for(const f of fixtures){
      for(const g of f.groups){
        if(g.name==="Cornere")continue;              // aproximativ — îl lăsăm afară
        const best=[...g.picks].sort((a,b)=>b.p-a.p)[0];
        if(!best)continue;
        if(best.p>=dMinP && best.odd>=dMinOdd)
          cand.push({f,group:g.name,label:best.label,p:best.p,odd:best.odd,real:best.real,edge:best.edge});
      }
    }
    cand.sort((a,b)=>dSort==="edge"?((b.edge??-9)-(a.edge??-9)):(b.p-a.p));
    const byDay={};
    for(const c of cand){(byDay[c.f.date]=byDay[c.f.date]||[]).push(c);}
    return Object.keys(byDay).sort().map(d=>({date:d,picks:byDay[d].slice(0,15)}));
  },[fixtures,dMinP,dMinOdd,dSort]);

  const combOdd=slip.reduce((a,s)=>a*s.odd,1), combProb=slip.reduce((a,s)=>a*s.p,1);
  const payout=stake>0?stake*combOdd:0;
  const copySlip=async()=>{const t="Bilet FormaCast\n"+slip.map((s,i)=>`${i+1}. ${s.match} | ${s.label} | ${fx2(s.odd)}`).join("\n")+`\n\nCotă totală: ${fx2(combOdd)}\nȘansă model: ${pct(combProb)}\nMiză: ${stake} → Câștig: ${payout.toFixed(2)}`;
    try{await navigator.clipboard.writeText(t);setCopied(true);setTimeout(()=>setCopied(false),1600);}catch{}};

  const wrap={maxWidth:900,margin:"0 auto",padding:"0 14px 120px"};
  const panel={background:"var(--panel)",border:"1px solid var(--line)",borderRadius:12};
  const chip=a=>({padding:"6px 11px",borderRadius:8,border:"1px solid "+(a?"var(--accent)":"var(--line)"),background:a?"var(--accent)":"transparent",color:a?"var(--bg)":"var(--mute)",fontSize:12.5,fontWeight:600,whiteSpace:"nowrap"});

  return <div>
    <header style={{borderBottom:"1px solid var(--lineSoft)",background:"var(--bg2)",marginBottom:16}}>
      <div style={{...wrap,padding:"18px 14px"}}>
        <div style={{fontSize:20,fontWeight:700,letterSpacing:-0.4}}>Forma<span style={{color:"var(--accent)"}}>·</span>Cast</div>
        <div style={{fontSize:12,color:"var(--mute)",marginTop:3}}>
          {data?`${fixtures.length} meciuri · actualizat ${data.updated_at?new Date(data.updated_at).toLocaleString("ro-RO"):"—"}`:err||"se încarcă…"}
        </div>
      </div>
    </header>
    <div style={wrap}>
      <div style={{display:"flex",gap:8,marginBottom:14,flexWrap:"wrap"}}>
        {[["matches","Meciuri"],["daily","Ponturi"],["live","Live radar"],["ledger","Registru"],["journal","Jurnal"],["backtest","Backtest"]].map(([id,l])=>
          <button key={id} onClick={()=>setTab(id)} style={{padding:"8px 14px",borderRadius:9,border:"none",background:tab===id?"var(--accent)":"var(--panel)",color:tab===id?"var(--bg)":"var(--mute)",fontSize:13,fontWeight:600}}>{l}</button>)}
      </div>

      {tab==="backtest"&&<Backtest leagues={leagues} panel={panel}/>}
      {tab==="live"&&<LiveRadar panel={panel}/>}
      {tab==="ledger"&&<Ledger panel={panel} fixtures={data?data.fixtures:[]}/>}
      {tab==="journal"&&<Journal panel={panel}/>}

      {tab==="daily"&&<React.Fragment>
        <div style={{...panel,padding:"14px 15px",marginBottom:14}}>
          <div style={{fontWeight:700,fontSize:14,marginBottom:4}}>Ponturile zilei</div>
          <div style={{fontSize:12,color:"var(--mute)",lineHeight:1.6,marginBottom:12}}>Cel mai probabil pont din fiecare piață a fiecărui meci, grupat pe zile. Filtrează după șansă și cotă minimă.</div>
          <div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
            <div style={{display:"flex",alignItems:"center",gap:7}}>
              <span style={{fontSize:12,color:"var(--mute)"}}>șansă min</span>
              <input type="range" min="0.5" max="0.9" step="0.05" value={dMinP} onChange={e=>setDMinP(parseFloat(e.target.value))} style={{width:90}}/>
              <span className="mono" style={{fontSize:12.5,color:"var(--accent)",width:34}}>{pct(dMinP)}</span>
            </div>
            <div style={{display:"flex",alignItems:"center",gap:7}}>
              <span style={{fontSize:12,color:"var(--mute)"}}>cotă min</span>
              <input type="range" min="1.0" max="2.0" step="0.05" value={dMinOdd} onChange={e=>setDMinOdd(parseFloat(e.target.value))} style={{width:80}}/>
              <span className="mono" style={{fontSize:12.5,color:"var(--accent)",width:34}}>{fx2(dMinOdd)}</span>
            </div>
            <div style={{display:"flex",background:"var(--chip)",border:"1px solid var(--line)",borderRadius:8,overflow:"hidden",marginLeft:"auto"}}>
              {[["prob","șansă"],["edge","edge"]].map(([id,l])=>
                <button key={id} onClick={()=>setDSort(id)} style={{padding:"6px 11px",border:"none",background:dSort===id?"var(--panelHi)":"transparent",color:dSort===id?"var(--text)":"var(--mute)",fontSize:12,fontWeight:600}}>{l}</button>)}
            </div>
          </div>
        </div>
        {daily.length===0&&<div style={{...panel,padding:22,color:"var(--mute)"}}>Niciun pont peste pragurile alese. Coboară șansa sau cota minimă.</div>}
        {daily.map((day,di)=>{
          const dd=day.date.split("-"); const label=`${dd[2]}.${dd[1]}`;
          return <div key={di} style={{marginBottom:16}}>
            <div style={{fontSize:12,textTransform:"uppercase",letterSpacing:0.8,color:"var(--faint)",margin:"4px 4px 8px"}}>{label} · {day.picks.length} ponturi</div>
            {day.picks.map((c,ci)=>{const sid=c.f.id+"|"+c.label; const sel=isSel(sid); const col=conf(c.p);
              return <div key={ci} onClick={()=>toggle(sid,{match:c.f.home+" – "+c.f.away,label:c.label,odd:c.odd,p:c.p,real:c.real})}
                style={{...panel,marginBottom:8,padding:"11px 13px",display:"flex",alignItems:"center",gap:11,cursor:"pointer",borderColor:sel?"var(--accent)":"var(--line)"}}>
                <div style={{width:15,height:15,borderRadius:4,border:"1.5px solid "+(sel?"var(--accent)":"var(--line)"),background:sel?"var(--accent)":"transparent",flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,color:"var(--bg)",fontWeight:700}}>{sel?"✓":""}</div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:13.5,fontWeight:600,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{c.label}</div>
                  <div style={{fontSize:11,color:"var(--faint)",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{c.f.home} – {c.f.away} · {divShort(c.f.div,c.f.league)} · {c.group}</div>
                </div>
                <div className="mono" style={{width:40,textAlign:"right",fontSize:15,color:col}}>{pct(c.p)}</div>
                <div className="mono" style={{width:44,textAlign:"right",fontSize:13,color:c.real?"var(--text)":"var(--mute)"}}>{fx2(c.odd)}</div>
                <div className="mono" style={{width:36,textAlign:"right",fontSize:12,color:c.edge==null?"var(--faint)":c.edge>0?"var(--strong)":"var(--weak)"}}>{c.edge==null?"–":(c.edge>0?"+":"")+Math.round(c.edge*100)}</div>
              </div>;})}
          </div>;
        })}
        <div style={{fontSize:11.5,color:"var(--faint)",marginTop:8,lineHeight:1.6}}>Atenție: „șansă mare" ≠ „profit". Ponturile cu 85-90% au cote mici, iar backtestul arată că nici combinate nu bat marja casei. Coloana edge (verde) e mai relevantă decât procentul pur. Nu e sfat financiar.</div>
      </React.Fragment>}

      {tab==="matches"&&<React.Fragment>
      {!data&&!err&&<div style={{...panel,padding:34,textAlign:"center",color:"var(--mute)"}}>Se încarcă datele live…</div>}
      {err&&<div style={{...panel,padding:24,color:"var(--weak)"}}>{err}</div>}
      {data&&fixtures.length===0&&<div style={{...panel,padding:30,textAlign:"center",color:"var(--mute)"}}>Serverul încă antrenează modelele sau nu sunt meciuri viitoare. Reîncearcă în câteva minute.</div>}

      {(fixtures.length>0||euro.length>0)&&<div className="scroll" style={{display:"flex",gap:7,overflowX:"auto",paddingBottom:12}}>
        <button onClick={()=>setDivF("ALL")} style={chip(divF==="ALL")}>Toate</button>
        {euro.length>0&&<button onClick={()=>setDivF("EURO")} style={chip(divF==="EURO")}>Cupe UEFA</button>}
        {leagues.map(l=><button key={l.div} onClick={()=>setDivF(l.div)} style={chip(divF===l.div)}>{divShort(l.div,l.league)}</button>)}
      </div>}

      {divF==="EURO"&&<React.Fragment>
        <div style={{...panel,padding:"12px 14px",marginBottom:10,fontSize:11.5,color:"var(--faint)",lineHeight:1.6}}>
          Champions / Europa / Conference League: doar programul (fără xG). Sursa noastră de istoric nu acoperă cupele europene, așa că modelul nu poate calcula o predicție reală aici — mai bine fără predicție decât una inventată.
        </div>
        {euro.length===0&&<div style={{...panel,padding:24,textAlign:"center",color:"var(--mute)"}}>Niciun meci găsit în fereastra curentă.</div>}
        {euro.map((e,i)=>{
          const t=fmtKick(e.iso);const dt=e.iso?e.iso.slice(0,10).split("-"):null;
          return <div key={i} style={{...panel,marginBottom:8,padding:"11px 14px",display:"flex",justifyContent:"space-between",alignItems:"baseline"}}>
            <div>
              <div style={{fontSize:14,fontWeight:600}}>{e.home} <span style={{color:"var(--faint)",fontWeight:400}}>–</span> {e.away}</div>
              <div className="mono" style={{fontSize:10.5,color:"var(--faint)",marginTop:2}}>{e.comp} · {dt?dt[2]+"."+dt[1]:""}</div>
            </div>
            <div className="mono" style={{fontSize:13,color:"var(--accent)",fontWeight:700}}>{t||"–"}</div>
          </div>;
        })}
      </React.Fragment>}

      {divF!=="EURO"&&list.map(f=>{
        const id=f.id, isOpen=open===id;
        const res=f.groups[0].picks; const one=[...res.slice(0,3)].sort((a,b)=>b.p-a.p)[0];
        const c=conf(one.p);
        return <div key={id} style={{...panel,marginBottom:9,overflow:"hidden"}}>
          <div className="row" onClick={()=>setOpen(isOpen?null:id)} style={{padding:"12px 14px",cursor:"pointer"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline"}}>
              <div style={{fontSize:15,fontWeight:600}}>{f.home} <span style={{color:"var(--faint)",fontWeight:400}}>–</span> {f.away}</div>
              <div className="mono" style={{fontSize:10.5,color:"var(--faint)"}}>{divShort(f.div,f.league)} · {fmtDate(f.date)}{fmtKick(f.kickoff)?" · "+fmtKick(f.kickoff):""}</div>
            </div>
            <div style={{display:"flex",alignItems:"center",gap:12,marginTop:8}}>
              <span className="mono" style={{fontSize:12.5,color:"var(--mute)"}}>xG {f.lh}–{f.la}</span>
              <span style={{fontSize:12.5,color:"var(--mute)"}}>favorit <b style={{color:c}}>{one.label}</b> {pct(one.p)}</span>
              <span style={{marginLeft:"auto",fontSize:11,color:"var(--faint)"}}>{isOpen?"▲":"▼ piețe"}</span>
            </div>
          </div>
          {isOpen&&<div style={{padding:"4px 14px 16px",borderTop:"1px solid var(--lineSoft)"}}>
            <div style={{display:"flex",fontSize:9.5,color:"var(--faint)",textTransform:"uppercase",letterSpacing:0.5,marginTop:6,paddingRight:6}}>
              <span style={{marginLeft:"auto",width:36,textAlign:"right"}}>%</span><span style={{width:44,textAlign:"right"}}>cotă</span><span style={{width:40,textAlign:"right"}}>edge</span>
            </div>
            {f.groups.map((g,gi)=><div key={gi} style={{marginTop:14}}>
              <div style={{fontSize:10.5,textTransform:"uppercase",letterSpacing:0.8,color:"var(--mute)",marginBottom:9,display:"flex",justifyContent:"space-between"}}>
                <span>{g.name}</span>{g.note&&<span style={{color:"var(--faint)",textTransform:"none"}}>{g.note}</span>}</div>
              {g.picks.map((pk,pi)=>{const sid=id+"|"+pk.label; const sel=isSel(sid); const cc=conf(pk.p);
                return <div key={pi} onClick={()=>toggle(sid,{match:f.home+" – "+f.away,label:pk.label,odd:pk.odd,p:pk.p,real:pk.real})}
                  style={{display:"flex",alignItems:"center",gap:9,marginBottom:5,cursor:"pointer",background:sel?"var(--panelHi)":"transparent",border:"1px solid "+(sel?"var(--accent)":"transparent"),borderRadius:7,padding:"3px 6px",margin:"0 -6px 4px"}}>
                  <div style={{width:15,height:15,borderRadius:4,border:"1.5px solid "+(sel?"var(--accent)":"var(--line)"),background:sel?"var(--accent)":"transparent",flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,color:"var(--bg)",fontWeight:700}}>{sel?"✓":""}</div>
                  <div style={{width:104,fontSize:12.5,color:"var(--mute)",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{pk.label}</div>
                  <Bar p={pk.p} color={cc}/>
                  <div className="mono" style={{width:36,textAlign:"right",fontSize:12.5,color:cc}}>{pct(pk.p)}</div>
                  <div className="mono" style={{width:44,textAlign:"right",fontSize:13,color:pk.real?"var(--text)":"var(--mute)"}}>{fx2(pk.odd)}</div>
                  <div className="mono" style={{width:40,textAlign:"right",fontSize:12,color:pk.edge==null?"var(--faint)":pk.edge>0?"var(--strong)":"var(--weak)"}}>{pk.edge==null?"–":(pk.edge>0?"+":"")+Math.round(pk.edge*100)}</div>
                </div>;})}
            </div>)}
            <div style={{marginTop:8,display:"flex",flexWrap:"wrap",gap:6}}>
              {f.scores.map((s,j)=><span key={j} className="mono" style={{fontSize:11.5,background:"var(--chip)",border:"1px solid var(--line)",borderRadius:6,padding:"3px 7px",color:"var(--mute)"}}>{s.x}-{s.y} {pct(s.p)}</span>)}
            </div>
            <div style={{fontSize:10.5,color:"var(--faint)",marginTop:10,lineHeight:1.5}}>Cotele reale (alb) vin din piață; cele gri sunt din model + marjă. „edge" = model − piață (pozitiv = posibilă valoare).</div>
          </div>}
        </div>;
      })}

      </React.Fragment>}

      <div style={{marginTop:22,fontSize:11.5,color:"var(--faint)",lineHeight:1.7,borderTop:"1px solid var(--lineSoft)",paddingTop:14}}>
        Model Dixon-Coles antrenat pe rezultate reale (full-time + repriza întâi) și cornere reale, reîmprospătat automat de pe football-data.co.uk. Doar meciurile de azi înainte. Selecțiile din același meci sunt corelate. Nu e sfat financiar. Pariază responsabil.
      </div>
    </div>

    {slip.length>0&&<div style={{position:"fixed",left:0,right:0,bottom:0,zIndex:50}}>
      {slipOpen&&<div style={{maxWidth:900,margin:"0 auto",background:"var(--bg2)",border:"1px solid var(--line)",borderTopLeftRadius:14,borderTopRightRadius:14,padding:"14px 14px 8px",maxHeight:"60vh",overflowY:"auto"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
          <b style={{fontSize:14}}>Biletul tău</b>
          <button onClick={()=>setSlip([])} style={{fontSize:11.5,background:"none",border:"1px solid var(--line)",borderRadius:7,padding:"4px 9px",color:"var(--weak)"}}>golește</button>
        </div>
        {slip.map(s=><div key={s.id} style={{display:"flex",alignItems:"center",gap:10,padding:"7px 0",borderBottom:"1px solid var(--lineSoft)"}}>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontSize:12.5,fontWeight:600,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{s.label}</div>
            <div style={{fontSize:10.5,color:"var(--faint)",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{s.match}</div>
          </div>
          <span className="mono" style={{fontSize:13,color:s.real?"var(--text)":"var(--mute)"}}>{fx2(s.odd)}</span>
          <button onClick={()=>setSlip(c=>c.filter(x=>x.id!==s.id))} style={{background:"none",border:"none",color:"var(--faint)",fontSize:16}}>×</button>
        </div>)}
        <div style={{display:"flex",alignItems:"center",gap:10,marginTop:12}}>
          <span style={{fontSize:12.5,color:"var(--mute)"}}>miză</span>
          <input type="number" value={stake} min="0" onChange={e=>setStake(parseFloat(e.target.value)||0)} className="mono" style={{width:80,background:"var(--chip)",color:"var(--text)",border:"1px solid var(--line)",borderRadius:8,padding:"7px 9px",fontSize:14}}/>
          <button onClick={copySlip} style={{marginLeft:"auto",fontSize:12.5,background:"var(--panel)",border:"1px solid var(--line)",borderRadius:8,padding:"8px 12px",color:copied?"var(--strong)":"var(--text)",fontWeight:600}}>{copied?"✓ copiat":"copiază biletul"}</button>
          <button onClick={async()=>{await copySlip();window.open("https://www.betano.ro","_blank");}} style={{fontSize:12.5,background:"var(--accent)",border:"none",borderRadius:8,padding:"8px 12px",color:"var(--bg)",fontWeight:700}}>Betano →</button>
        </div>
        <div style={{fontSize:10.5,color:"var(--faint)",marginTop:8,lineHeight:1.5}}>„Betano →" copiază biletul și deschide site-ul. Selecțiile le adaugi tu manual acolo — casele nu permit completarea biletului din exterior.</div>
      </div>}
      <div onClick={()=>setSlipOpen(o=>!o)} style={{maxWidth:900,margin:"0 auto",background:"var(--accent)",color:"var(--bg)",padding:"13px 16px",display:"flex",alignItems:"center",gap:12,cursor:"pointer"}}>
        <b style={{fontSize:13}}>Bilet · {slip.length}</b>
        <span className="mono" style={{fontSize:13}}>cotă {fx2(combOdd)}</span>
        <span className="mono" style={{marginLeft:"auto",fontSize:13,fontWeight:700}}>{slipOpen?"▼":"▲"} câștig {payout.toFixed(2)}</span>
      </div>
    </div>}
  </div>;
}

function Backtest({leagues,panel}){
  const[div,setDiv]=useState(leagues[0]?leagues[0].div:"E0");
  const[edge,setEdge]=useState(0.05),[bt,setBt]=useState(null),[running,setRunning]=useState(false);
  const poll=React.useRef(null);
  useEffect(()=>()=>clearInterval(poll.current),[]);
  const run=()=>{
    setBt({status:"running"});setRunning(true);clearInterval(poll.current);
    const tick=()=>fetch(`${API}/api/backtest?div=${div}&edge=${edge}`).then(r=>r.json()).then(d=>{
      setBt(d); if(d.status!=="running"){clearInterval(poll.current);setRunning(false);}
    }).catch(()=>{clearInterval(poll.current);setRunning(false);setBt({status:"error",error:"eroare rețea"});});
    tick(); poll.current=setInterval(tick,3000);
  };
  const M=(label,val,sub,color)=><div style={{...panel,padding:"13px 15px"}}>
    <div style={{fontSize:10,textTransform:"uppercase",letterSpacing:0.6,color:"var(--faint)"}}>{label}</div>
    <div className="mono" style={{fontSize:24,color:color||"var(--text)",marginTop:5}}>{val}</div>
    {sub&&<div style={{fontSize:11,color:"var(--mute)",marginTop:2}}>{sub}</div>}</div>;
  const eq=bt&&bt.equity&&bt.equity.length>1?bt.equity:null;
  let poly="",zeroY=0,up=true;
  if(eq){const mn=Math.min(0,...eq),mx=Math.max(0,...eq),rg=(mx-mn)||1;
    poly=eq.map((v,i)=>`${(10+i/(eq.length-1)*980).toFixed(1)},${(10+(1-(v-mn)/rg)*160).toFixed(1)}`).join(" ");
    zeroY=10+(1-(0-mn)/rg)*160; up=eq[eq.length-1]>=0;}
  return <div>
    <div style={{...panel,padding:"16px 16px",marginBottom:16}}>
      <div style={{fontWeight:700,fontSize:14,marginBottom:4}}>Validare walk-forward</div>
      <div style={{fontSize:12.5,color:"var(--mute)",lineHeight:1.6,marginBottom:14}}>Modelul e reantrenat înainte de fiecare etapă și prezice „în orb". Îți arată acuratețea reală și randamentul dacă ai fi pariat pick-urile cu edge peste prag, la cotele istorice.</div>
      <div style={{display:"flex",gap:12,alignItems:"center",flexWrap:"wrap"}}>
        <select value={div} onChange={e=>setDiv(e.target.value)} style={{background:"var(--chip)",color:"var(--text)",border:"1px solid var(--line)",borderRadius:8,padding:"8px 10px",fontSize:13.5}}>
          {(leagues.length?leagues:[{div:"E0",league:"Anglia · Premier League"}]).map(l=><option key={l.div} value={l.div}>{l.league}</option>)}
        </select>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <span style={{fontSize:12,color:"var(--mute)"}}>edge min</span>
          <input type="range" min="0" max="0.2" step="0.01" value={edge} onChange={e=>setEdge(parseFloat(e.target.value))} style={{width:100}} disabled={running}/>
          <span className="mono" style={{fontSize:13,color:"var(--accent)",width:36}}>{Math.round(edge*100)}%</span>
        </div>
        <button onClick={run} disabled={running} style={{marginLeft:"auto",padding:"9px 16px",borderRadius:9,border:"none",background:running?"var(--line)":"var(--accent)",color:running?"var(--faint)":"var(--bg)",fontSize:13,fontWeight:700}}>{running?"rulează…":"rulează backtest"}</button>
      </div>
    </div>
    {bt&&bt.status==="running"&&<div style={{...panel,padding:20,color:"var(--mute)"}}>Se antrenează și se testează… (poate dura 30–90s pe planul gratuit)</div>}
    {bt&&bt.status==="error"&&<div style={{...panel,padding:20,color:"var(--weak)"}}>{bt.error||"eroare"}</div>}
    {bt&&bt.status==="done"&&<React.Fragment>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:12}}>
        {M("Acuratețe 1X2",Math.round(bt.acc*100)+"%",bt.correct+"/"+bt.tested,"var(--accent)")}
        {M("ROI (value)",(bt.roi>=0?"+":"")+(bt.roi*100).toFixed(1)+"%",bt.bets+" pariuri",bt.roi>=0?"var(--strong)":"var(--weak)")}
        {M("Log-loss",bt.logloss,"mai mic = mai bun")}
        {M("Profit",(bt.profit>=0?"+":"")+bt.profit+"u","mize de 1u",bt.profit>=0?"var(--strong)":"var(--weak)")}
      </div>
      {eq&&<div style={{...panel,padding:"14px 15px"}}>
        <div style={{fontSize:10,textTransform:"uppercase",letterSpacing:0.6,color:"var(--faint)",marginBottom:8}}>Curba de profit (unități)</div>
        <svg viewBox="0 0 1000 180" style={{width:"100%",height:170}} preserveAspectRatio="none">
          <line x1="10" y1={zeroY} x2="990" y2={zeroY} stroke="var(--line)" strokeWidth="1" strokeDasharray="4 4"/>
          <polyline points={poly} fill="none" stroke={up?"var(--strong)":"var(--weak)"} strokeWidth="2"/>
        </svg>
      </div>}
      <div style={{fontSize:11.5,color:"var(--faint)",marginTop:12,lineHeight:1.6}}>Reper: acuratețea „ghicind favoritul din cotă" e ~50–55%. ROI pozitiv susținut e greu — dacă iese negativ, e semnalul corect că piața e eficientă acolo, nu un bug.</div>
    </React.Fragment>}
  </div>;
}

function Ledger({panel,fixtures}){
  const[sum,setSum]=useState(null);const[list,setList]=useState(null);const[err,setErr]=useState(null);
  const[tab,setTab]=useState("dash");const[busy,setBusy]=useState(false);
  // add-bet form state
  const[mId,setMId]=useState("");const[gName,setGName]=useState("");const[selLabel,setSelLabel]=useState("");
  const[btype,setBtype]=useState("prematch");const[odds,setOdds]=useState("");const[stake,setStake]=useState("");
  const[cfgBank,setCfgBank]=useState("");const[savedCfg,setSavedCfg]=useState(false);
  const load=()=>{
    fetch(API+"/api/ledger/summary").then(r=>r.json()).then(setSum).catch(()=>setErr("eroare rețea"));
    fetch(API+"/api/bets?limit=200").then(r=>r.json()).then(d=>setList(d.bets||[])).catch(()=>{});
  };
  useEffect(load,[]);
  useEffect(()=>{if(sum&&!stake&&sum.suggested_stake)setStake(String(sum.suggested_stake));},[sum]);

  const fx=fixtures||[];
  const match=fx.find(f=>f.id===mId);
  const groups=match?match.groups:[];
  const grp=groups.find(g=>g.name===gName);
  const picks=grp?grp.picks:[];
  const pick=picks.find(p=>p.label===selLabel);
  useEffect(()=>{if(pick&&pick.odd)setOdds(String(pick.odd));},[selLabel]);

  const pct=x=>x==null?"–":Math.round(x*100)+"%";
  const clvColor=x=>x==null?"var(--faint)":x>0?"var(--strong)":x<0?"var(--weak)":"var(--mute)";
  const money=x=>x==null?"–":(x>0?"+":"")+Number(x).toFixed(2);

  const submit=async()=>{
    if(!match||!selLabel||!odds||!stake){return;}
    setBusy(true);
    const body={match_id:match.id,div:match.div,league:match.league,home:match.home,away:match.away,
      match_date:match.date,kickoff:match.kickoff,market:gName,selection:selLabel,bet_type:btype,
      odds:parseFloat(odds),stake:parseFloat(stake),model_prob:pick?pick.p:null};
    try{const r=await fetch(API+"/api/bets",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
      if(r.ok){setMId("");setGName("");setSelLabel("");setOdds("");setStake("");load();setTab("bets");}
    }catch{}
    setBusy(false);
  };
  const settle=async(id,status)=>{await fetch(API+`/api/bets/${id}/settle`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({status})});load();};
  const del=async(id)=>{await fetch(API+`/api/bets/${id}/delete`,{method:"POST"});load();};
  const saveBank=async()=>{const v=parseFloat(cfgBank);if(!(v>0))return;
    await fetch(API+"/api/ledger/config",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({start_bank:v})});
    setCfgBank("");setSavedCfg(true);setTimeout(()=>setSavedCfg(false),1600);load();};

  const inp={background:"var(--chip)",color:"var(--text)",border:"1px solid var(--line)",borderRadius:8,padding:"9px 10px",fontSize:14,width:"100%",boxSizing:"border-box"};
  const lbl={fontSize:11,color:"var(--faint)",marginBottom:4,display:"block"};

  if(err)return <div style={{...panel,padding:18,color:"var(--weak)"}}>{err}</div>;
  if(!sum)return <div style={{...panel,padding:18,color:"var(--mute)"}}>Se încarcă registrul…</div>;

  // mini bank curve (sparkline)
  const curve=sum.curve||[];const cmin=Math.min(sum.start_bank,...curve),cmax=Math.max(sum.start_bank,...curve);
  const spark=(()=>{if(curve.length<2)return null;const w=280,h=48,pad=3;const pts=[sum.start_bank,...curve];
    const rng=(cmax-cmin)||1;const step=(w-2*pad)/(pts.length-1);
    const d=pts.map((v,i)=>`${pad+i*step},${h-pad-((v-cmin)/rng)*(h-2*pad)}`).join(" ");
    const up=pts[pts.length-1]>=pts[0];
    return <svg width="100%" viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="none" style={{display:"block"}}><polyline points={d} fill="none" stroke={up?"var(--strong)":"var(--weak)"} strokeWidth="2"/></svg>;})();

  return <React.Fragment>
    <div style={{display:"flex",gap:8,marginBottom:12}}>
      {[["dash","Tablou"],["add","+ Pariu"],["bets","Pariuri"]].map(([id,l])=>
        <button key={id} onClick={()=>setTab(id)} style={{padding:"7px 12px",borderRadius:8,border:"none",fontSize:12.5,fontWeight:600,background:tab===id?"var(--accent)":"var(--panel)",color:tab===id?"var(--bg)":"var(--mute)"}}>{l}</button>)}
    </div>

    {tab==="dash"&&<React.Fragment>
      <div style={{...panel,padding:"14px 16px",marginBottom:10}}>
        <div style={{fontSize:11,color:"var(--faint)"}}>Bancă</div>
        <div style={{display:"flex",alignItems:"baseline",gap:8}}>
          <div className="mono" style={{fontSize:30,fontWeight:700}}>{sum.bank.toFixed(2)}</div>
          <div className="mono" style={{fontSize:13,color:sum.profit>=0?"var(--strong)":"var(--weak)"}}>{money(sum.profit)}</div>
          <div style={{marginLeft:"auto",fontSize:11,color:"var(--faint)",textAlign:"right"}}>țintă {sum.target.toFixed(0)}<br/>start {sum.start_bank.toFixed(0)}</div>
        </div>
        {spark}
        <div style={{display:"flex",justifyContent:"space-between",fontSize:11,color:"var(--faint)",marginTop:4}}>
          <span>{sum.pending_n} în joc ({sum.pending_stake.toFixed(2)} lei)</span>
          <span>miză sugerată: <b style={{color:"var(--accent)"}}>{sum.suggested_stake.toFixed(2)} lei</b> ({Math.round(sum.unit_pct*100)}%)</span>
        </div>
      </div>

      <div style={{...panel,padding:"10px 14px",marginBottom:10,display:"flex",alignItems:"center",gap:8}}>
        <span style={{fontSize:11,color:"var(--faint)"}}>Bancă de start</span>
        <input type="number" step="1" value={cfgBank} onChange={e=>setCfgBank(e.target.value)} placeholder={sum.start_bank.toFixed(0)} className="mono" style={{width:80,background:"var(--chip)",color:"var(--text)",border:"1px solid var(--line)",borderRadius:8,padding:"7px 9px",fontSize:14}}/>
        <button onClick={saveBank} style={{fontSize:12,padding:"7px 11px",borderRadius:8,background:savedCfg?"var(--strong)":"var(--panel)",border:"1px solid var(--line)",color:savedCfg?"var(--bg)":"var(--mute)",fontWeight:600}}>{savedCfg?"✓ setat":"setează"}</button>
        <span style={{marginLeft:"auto",fontSize:10,color:"var(--faint)",textAlign:"right"}}>pune soldul tău<br/>real de acum</span>
      </div>

      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:10}}>
        {[["Yield",sum.yield==null?"–":pct(sum.yield),"profit / miză"],
          ["ROI bancă",sum.roi_bank==null?"–":pct(sum.roi_bank),"creșterea băncii"],
          ["Succes",sum.strike==null?"–":pct(sum.strike),sum.settled_n+" închise"]].map(([t,v,s])=>
          <div key={t} style={{...panel,padding:"10px 11px"}}>
            <div style={{fontSize:10.5,color:"var(--faint)"}}>{t}</div>
            <div className="mono" style={{fontSize:18,fontWeight:700}}>{v}</div>
            <div style={{fontSize:9.5,color:"var(--faint)"}}>{s}</div>
          </div>)}
      </div>

      <div style={{...panel,padding:"12px 14px",marginBottom:10}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginBottom:6}}>
          <div style={{fontSize:12.5,fontWeight:700}}>CLV mediu (prematch)</div>
          <div className="mono" style={{fontSize:18,fontWeight:700,color:clvColor(sum.avg_clv)}}>{sum.avg_clv==null?"–":pct(sum.avg_clv)}</div>
        </div>
        <div style={{fontSize:10.5,color:"var(--faint)",lineHeight:1.5}}>Cât de des baţi cota de închidere. Peste 0 constant, pe multe pariuri = edge real. E semnalul care contează, nu banca de azi.</div>
      </div>

      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
        {[["Prematch",sum.prematch],["Live",sum.live]].map(([t,d])=>
          <div key={t} style={{...panel,padding:"11px 13px"}}>
            <div style={{fontSize:12,fontWeight:700,marginBottom:5}}>{t}</div>
            <div style={{fontSize:11.5,color:"var(--mute)",lineHeight:1.7}}>
              {d.n} pariuri<br/>
              profit <b style={{color:d.profit>=0?"var(--strong)":"var(--weak)"}}>{money(d.profit)}</b><br/>
              yield <b>{d.yield==null?"–":pct(d.yield)}</b> · succes <b>{d.strike==null?"–":pct(d.strike)}</b>
            </div>
          </div>)}
      </div>
      <div style={{fontSize:10,color:"var(--faint)",textAlign:"center",marginTop:12,lineHeight:1.5}}>Sub ~100 de pariuri cifrele sunt zgomot. Contează tendinţa pe volum mare, nu rezultatul unei zile.</div>
    </React.Fragment>}

    {tab==="add"&&<div style={{...panel,padding:"14px 15px"}}>
      <div style={{fontSize:13.5,fontWeight:700,marginBottom:12}}>Adaugă un pariu pe care l-ai pus</div>
      <div style={{marginBottom:10}}>
        <label style={lbl}>Meci</label>
        <select style={inp} value={mId} onChange={e=>{setMId(e.target.value);setGName("");setSelLabel("");}}>
          <option value="">— alege meciul —</option>
          {fx.map(f=><option key={f.id} value={f.id}>{f.home} – {f.away} ({divShort(f.div,f.league)})</option>)}
        </select>
      </div>
      {match&&<div style={{marginBottom:10}}>
        <label style={lbl}>Piață</label>
        <select style={inp} value={gName} onChange={e=>{setGName(e.target.value);setSelLabel("");}}>
          <option value="">— alege piața —</option>
          {groups.map(g=><option key={g.name} value={g.name}>{g.name}</option>)}
        </select>
      </div>}
      {grp&&<div style={{marginBottom:10}}>
        <label style={lbl}>Selecție (șansă model · cotă model)</label>
        <select style={inp} value={selLabel} onChange={e=>setSelLabel(e.target.value)}>
          <option value="">— alege selecția —</option>
          {picks.map(p=><option key={p.label} value={p.label}>{p.label} · {Math.round(p.p*100)}% · {fx2(p.odd)}</option>)}
        </select>
      </div>}
      <div style={{display:"flex",gap:8,marginBottom:10}}>
        <div style={{flex:1}}>
          <label style={lbl}>Tip</label>
          <div style={{display:"flex",gap:6}}>
            {["prematch","live"].map(t=><button key={t} onClick={()=>setBtype(t)} style={{flex:1,padding:"9px 0",borderRadius:8,border:"none",fontSize:12.5,fontWeight:600,background:btype===t?"var(--accent)":"var(--chip)",color:btype===t?"var(--bg)":"var(--mute)"}}>{t}</button>)}
          </div>
        </div>
      </div>
      <div style={{display:"flex",gap:8,marginBottom:14}}>
        <div style={{flex:1}}><label style={lbl}>Cota luată</label>
          <input style={inp} type="number" step="0.01" value={odds} onChange={e=>setOdds(e.target.value)} placeholder="ex. 1.85"/></div>
        <div style={{flex:1}}><label style={lbl}>Miză (lei)</label>
          <input style={inp} type="number" step="0.1" value={stake} onChange={e=>setStake(e.target.value)}/></div>
      </div>
      {btype==="prematch"&&pick&&odds&&<div style={{fontSize:11,color:clvColor(parseFloat(odds)*pick.p-1),marginBottom:10}}>
        Valoare estimată acum: {((parseFloat(odds)*pick.p-1)*100).toFixed(1)}% (cotă × șansă model − 1)</div>}
      <button onClick={submit} disabled={busy||!match||!selLabel||!odds||!stake} style={{width:"100%",padding:12,borderRadius:9,border:"none",background:"var(--accent)",color:"var(--bg)",fontSize:14.5,fontWeight:700,opacity:(busy||!match||!selLabel||!odds||!stake)?0.5:1}}>{busy?"…":"Adaugă în registru"}</button>
      <div style={{fontSize:10.5,color:"var(--faint)",marginTop:10,lineHeight:1.5}}>Pune cota exact cât ai prins pe Betano. La prematch, CLV-ul se calculează singur când se joacă meciul.</div>
    </div>}

    {tab==="bets"&&<React.Fragment>
      {(!list||list.length===0)?<div style={{...panel,padding:18,color:"var(--mute)"}}>Niciun pariu în registru încă. Adaugă unul din „+ Pariu".</div>
      :list.map(b=>{
        const done=b.status!=="pending";
        const c=b.status==="won"?"var(--strong)":b.status==="lost"?"var(--weak)":b.status==="void"?"var(--mute)":"var(--faint)";
        return <div key={b.id} style={{...panel,marginBottom:8,padding:"11px 13px"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline"}}>
            <div style={{fontSize:13.5,fontWeight:600}}>{b.home} – {b.away}</div>
            <div style={{display:"flex",gap:6,alignItems:"baseline"}}>
              <span style={{fontSize:9.5,padding:"1px 6px",borderRadius:5,background:"var(--chip)",color:"var(--faint)"}}>{b.bet_type}</span>
              <span className="mono" style={{fontSize:12.5,color:c,fontWeight:700}}>{done?(b.status==="won"?"✓":b.status==="lost"?"✗":"—"):"…"}</span>
            </div>
          </div>
          <div style={{fontSize:11.5,color:"var(--mute)",marginTop:3}}>{b.market}: <b style={{color:"var(--text)"}}>{b.selection}</b> · cotă {fx2(b.odds)} · miză {Number(b.stake).toFixed(2)}</div>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:6}}>
            <div style={{fontSize:11}}>
              {done?<span className="mono" style={{color:b.pl>=0?"var(--strong)":"var(--weak)"}}>{money(b.pl)} lei{b.clv_pct!=null?<span style={{color:clvColor(b.clv_pct)}}> · CLV {(b.clv_pct*100).toFixed(1)}%</span>:""}</span>
                :<span style={{color:"var(--faint)"}}>în așteptare</span>}
            </div>
            {!done&&<div style={{display:"flex",gap:6}}>
              <button onClick={()=>settle(b.id,"won")} style={{fontSize:11,padding:"5px 9px",borderRadius:7,border:"none",background:"var(--strong)",color:"var(--bg)",fontWeight:700}}>Câștigat</button>
              <button onClick={()=>settle(b.id,"lost")} style={{fontSize:11,padding:"5px 9px",borderRadius:7,border:"none",background:"var(--weak)",color:"var(--bg)",fontWeight:700}}>Pierdut</button>
              <button onClick={()=>del(b.id)} style={{fontSize:11,padding:"5px 8px",borderRadius:7,border:"1px solid var(--line)",background:"transparent",color:"var(--faint)"}}>șterge</button>
            </div>}
          </div>
        </div>;
      })}
      <div style={{fontSize:10.5,color:"var(--faint)",textAlign:"center",marginTop:8,lineHeight:1.5}}>Cele mai multe se închid singure când se joacă meciul. Butoanele Câștigat/Pierdut sunt pentru piețe pe care modelul nu le poate verifica automat.</div>
    </React.Fragment>}
  </React.Fragment>;
}

function Journal({panel}){
  const[s,setS]=useState(null);const[e,setE]=useState(null);const[err,setErr]=useState(null);
  const[showAll,setShowAll]=useState(false);
  useEffect(()=>{
    fetch(API+"/api/journal/stats").then(r=>r.json()).then(setS).catch(()=>setErr("eroare rețea"));
    fetch(API+"/api/journal?limit=80").then(r=>r.json()).then(d=>setE(d.entries||[])).catch(()=>{});
  },[]);
  const pct=x=>x==null?"–":Math.round(x*100)+"%";
  const cell={fontSize:12.5,padding:"2px 0"};
  if(err)return <div style={{...panel,padding:18,color:"var(--weak)"}}>{err}</div>;
  if(!s)return <div style={{...panel,padding:18,color:"var(--mute)"}}>Se încarcă jurnalul…</div>;
  const settled=s.settled||0;
  const list=(e||[]).filter(x=>showAll||x.result!=null);
  return <React.Fragment>
    <div style={{...panel,padding:"14px 15px",marginBottom:12}}>
      <div style={{fontWeight:700,fontSize:14,marginBottom:4}}>Jurnal de predicții · track record real</div>
      <div style={{fontSize:12,color:"var(--mute)",lineHeight:1.6}}>Fiecare predicție e salvată înainte de meci și comparată cu rezultatul real. Cifrele de aici sunt istoricul TĂU, nu backtest teoretic. Se adună în timp.</div>
    </div>
    {settled===0?
      <div style={{...panel,padding:20,color:"var(--mute)",lineHeight:1.6}}>
        <b style={{color:"var(--text)"}}>{s.total||0}</b> predicții înregistrate, niciuna închisă încă.<br/>
        Revino după ce se joacă meciurile — atunci apar acuratețea și calibrarea.
      </div>
    :
      <React.Fragment>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:9,marginBottom:12}}>
          <div style={{...panel,padding:"12px 14px"}}>
            <div style={{fontSize:11,color:"var(--faint)"}}>Acuratețe 1X2</div>
            <div className="mono" style={{fontSize:22,fontWeight:700,color:"var(--accent)"}}>{pct(s.acc1x2)}</div>
            <div style={{fontSize:10.5,color:"var(--faint)"}}>{settled} meciuri închise</div>
          </div>
          <div style={{...panel,padding:"12px 14px"}}>
            <div style={{fontSize:11,color:"var(--faint)"}}>Brier (mai mic = mai bun)</div>
            <div className="mono" style={{fontSize:22,fontWeight:700}}>{s.brier}</div>
            <div style={{fontSize:10.5,color:"var(--faint)"}}>{s.pending} în așteptare</div>
          </div>
        </div>
        <div style={{...panel,padding:"12px 14px",marginBottom:12}}>
          <div style={{fontSize:12,fontWeight:700,marginBottom:8}}>Calibrare — cât de sincer prezice modelul</div>
          {[["Peste 2.5 goluri",s.over25],["Ambele înscriu",s.btts]].map(([lbl,o])=>o&&
            <div key={lbl} style={{display:"flex",justifyContent:"space-between",...cell}}>
              <span style={{color:"var(--mute)"}}>{lbl}</span>
              <span className="mono">prezis {pct(o.pred)} · real <b style={{color:Math.abs((o.pred||0)-(o.real||0))<0.06?"var(--strong)":"var(--mid)"}}>{pct(o.real)}</b> <span style={{color:"var(--faint)"}}>({o.n})</span></span>
            </div>)}
          <div style={{fontSize:10.5,color:"var(--faint)",marginTop:8,lineHeight:1.5}}>Dacă „prezis" și „real" sunt apropiate, modelul e cinstit cu tine. Diferențe mari = supra/subestimează.</div>
        </div>
        {s.per_league&&s.per_league.length>0&&
          <div style={{...panel,padding:"12px 14px",marginBottom:12}}>
            <div style={{fontSize:12,fontWeight:700,marginBottom:8}}>Acuratețe pe ligă</div>
            {s.per_league.map(l=>
              <div key={l.league} style={{display:"flex",justifyContent:"space-between",...cell}}>
                <span style={{color:"var(--mute)"}}>{l.league}</span>
                <span className="mono"><b style={{color:l.acc>=0.5?"var(--strong)":"var(--text)"}}>{pct(l.acc)}</b> <span style={{color:"var(--faint)"}}>({l.n})</span></span>
              </div>)}
          </div>}
      </React.Fragment>
    }
    <div style={{display:"flex",alignItems:"center",gap:10,margin:"4px 2px 10px"}}>
      <div style={{fontSize:13,fontWeight:700}}>Predicții</div>
      <button onClick={()=>setShowAll(!showAll)} style={{marginLeft:"auto",fontSize:12,background:"var(--panel)",border:"1px solid var(--line)",borderRadius:8,padding:"6px 10px",color:"var(--mute)"}}>{showAll?"doar închise":"arată toate"}</button>
    </div>
    {list.length===0?
      <div style={{...panel,padding:18,color:"var(--mute)"}}>Nimic de arătat încă.</div>
      :list.map((x,i)=>{
        const done=x.result!=null;
        const ok=x.correct1x2===1;
        return <div key={i} style={{...panel,marginBottom:8,padding:"11px 14px"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline"}}>
            <div style={{fontSize:14,fontWeight:600}}>{x.home} – {x.away}</div>
            {done?
              <span className="mono" style={{fontSize:12.5,color:ok?"var(--strong)":"var(--weak)"}}>{ok?"✓":"✗"} {x.fthg}-{x.ftag}</span>
              :<span style={{fontSize:11,color:"var(--faint)"}}>în așteptare</span>}
          </div>
          <div style={{fontSize:11.5,color:"var(--faint)",marginTop:3}}>
            {divShort(x.div,x.league)} · prezis <b style={{color:"var(--mute)"}}>{x.fav}</b> ({pct(x.fav_p)})
            {done&&<span> · a ieșit <b style={{color:"var(--mute)"}}>{x.result}</b></span>}
          </div>
        </div>;
      })}
    <div style={{fontSize:10.5,color:"var(--faint)",textAlign:"center",marginTop:10,lineHeight:1.5}}>Stocare: se adună la fiecare actualizare. Pentru istoric permanent (peste redeploy), leagă o bază de date — vezi /api/journal/debug.</div>
  </React.Fragment>;
}

function LiveRadar({panel}){
  const[d,setD]=useState(null),[err,setErr]=useState(null),[minScore,setMinScore]=useState(0.6);
  useEffect(()=>{fetch(API+"/api/live-radar").then(r=>r.json()).then(setD).catch(()=>setErr("eroare rețea"));},[]);
  const list=d&&d.targets?d.targets.filter(t=>t.score>=minScore):[];
  return <div>
    <div style={{...panel,padding:"14px 15px",marginBottom:14}}>
      <div style={{fontWeight:700,fontSize:14,marginBottom:4}}>Live radar · ținte pentru pariu la live</div>
      <div style={{fontSize:12,color:"var(--mute)",lineHeight:1.6}}>Meciurile de azi unde modelul zice că se marchează mult. Dacă urmărești unul și vezi 0-0 după startul reprizei, ai motive să intri pe <b style={{color:"var(--text)"}}>peste 1.5 / 2.5 live</b> la cotă crescută. „Așteaptă până în min X" e reperul până la care merită să aștepți la 0-0.</div>
      <div style={{display:"flex",alignItems:"center",gap:9,marginTop:10}}>
        <span style={{fontSize:12,color:"var(--mute)"}}>scor radar min</span>
        <input type="range" min="0.4" max="0.85" step="0.05" value={minScore} onChange={e=>setMinScore(parseFloat(e.target.value))} style={{width:110}}/>
        <span className="mono" style={{fontSize:12.5,color:"var(--accent)",width:34}}>{Math.round(minScore*100)}</span>
      </div>
    </div>
    {err&&<div style={{...panel,padding:18,color:"var(--weak)"}}>{err}</div>}
    {d&&list.length===0&&<div style={{...panel,padding:20,color:"var(--mute)"}}>Niciun meci peste pragul ales azi. Coboară scorul minim.</div>}
    {list.map((t,i)=>{
      const dd=t.date?t.date.slice(0,10).split("-"):null;
      const col=t.score>=0.72?"var(--strong)":t.score>=0.6?"var(--mid)":"var(--weak)";
      return <div key={i} style={{...panel,marginBottom:9,padding:"13px 15px"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline"}}>
          <div style={{fontSize:14.5,fontWeight:600}}>{t.home} – {t.away}</div>
          <div className="mono" style={{fontSize:16,color:col}}>{Math.round(t.score*100)}</div>
        </div>
        <div style={{fontSize:11,color:"var(--faint)",marginBottom:10}}>{dd?dd[2]+"."+dd[1]:""}{fmtKick(t.kickoff)?" · "+fmtKick(t.kickoff):""} · xG {t.lh}–{t.la} · total așteptat {t.mu?.toFixed?t.mu.toFixed(2):t.mu}</div>
        <div style={{display:"flex",gap:14,flexWrap:"wrap",fontSize:12.5}}>
          <span style={{color:"var(--mute)"}}>Peste 1.5: <b style={{color:"var(--text)"}}>{Math.round((t.o15||0)*100)}%</b></span>
          <span style={{color:"var(--mute)"}}>Peste 2.5: <b style={{color:"var(--text)"}}>{Math.round((t.o25||0)*100)}%</b></span>
          <span style={{color:"var(--mute)"}}>GG: <b style={{color:"var(--text)"}}>{Math.round((t.gg||0)*100)}%</b></span>
        </div>
        <div style={{marginTop:9,padding:"7px 10px",background:"var(--chip)",borderRadius:8,fontSize:12.5,color:"var(--accent)"}}>
          La 0-0, așteaptă până în min ~{t.wait_min}{(()=>{const k=t.kickoff&&new Date(t.kickoff);if(!k||isNaN(k))return"";const w=new Date(k.getTime()+t.wait_min*60000);return " (~"+w.toLocaleTimeString("ro-RO",{hour:"2-digit",minute:"2-digit"})+")";})()}, apoi caută cotă crescută pe peste 1.5/2.5 live
        </div>
      </div>;
    })}
    <div style={{fontSize:11.5,color:"var(--faint)",marginTop:10,lineHeight:1.6}}>
      Astea sunt ținte pre-calculate, nu date live reale — aplicația nu vede scorul sau minutul în timp real. Tu urmărești meciul și decizi. Un 0-0 prelungit poate însemna și că modelul a supraevaluat golurile — nu intra orbește. Nu e sfat financiar. Pariază responsabil.
    </div>
  </div>;
}

function App(){const[a,setA]=useState(false);return a?<Board/>:<Login onOk={()=>setA(true)}/>;}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("/sw.js").catch(()=>{});});}
</script>
</body>
